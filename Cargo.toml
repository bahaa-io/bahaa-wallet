[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/bahaa-io/bahaa-wallet"
publish = false

[workspace.dependencies]
alloy-consensus = { version = "2.5.0", features = ["k256"] }
alloy-eips = "2.5.0"
alloy-primitives = "1.7.3"
alloy-signer = "2.5.0"
alloy-signer-local = { version = "2.5.0", features = ["mnemonic"] }
anyhow = "1.0.104"
base64 = "0.23.1"
bs58 = { version = "0.5.1", features = ["check"] }
ed25519-dalek = "3.0.0"
futures-util = { version = "0.3.34", features = ["sink"] }
getrandom = "0.4.3"
hmac = "0.12.1"
k256 = "0.13.4"
num-bigint = "0.4.8"
pbkdf2 = "0.12.2"
prost = "0.14.4"
reqwest = { version = "0.13.5", features = ["json"] }
ruint = "1.20.1"
rustls = "0.23.46"
rustls-platform-verifier = "0.7.1"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sha3 = "0.11.0"
thiserror = "2.0.21"
tokio = "1.53.3"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tonlib-core = "0.26.11"
ton_liteapi = "0.2.0"
unicode-normalization = "0.1.26"
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
mem_forget = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
overflow-checks = true
