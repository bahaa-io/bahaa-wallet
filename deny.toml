[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0388", reason = "derivative is a build-time macro pulled in by ton_liteapi for bahaa-probe only; revisit when choosing the TON library" },
    { id = "RUSTSEC-2024-0436", reason = "paste is a finished build-time macro used by alloy-primitives; no runtime code, no known flaw" },
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[[licenses.clarify]]
crate = "everscale-crypto"
expression = "MIT"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
